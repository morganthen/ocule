<!doctype html>
<html lang="en" data-theme="dark" data-font="mono">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://ocule.app/" />

    <title>Oculé — a quiet speed reader for the web</title>
    <meta
      name="description"
      content="Oculé is a browser-only speed reader. RSVP word streaming with an ORP letter anchor, plus a guided highlight mode — paste any text and read it noticeably faster."
    />
    <meta name="author" content="Oculé" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#14110F" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F5F1E8" media="(prefers-color-scheme: light)" />

    <!-- Open Graph (Facebook, LinkedIn, Slack, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Oculé" />
    <meta property="og:title" content="Oculé — a quiet speed reader for the web" />
    <meta
      property="og:description"
      content="Browser-only speed reader. RSVP word streaming with an ORP letter anchor, plus a guided highlight mode."
    />
    <meta property="og:url" content="https://ocule.app/" />
    <meta property="og:image" content="https://ocule.app/screenshot-1.png" />
    <meta property="og:image:width" content="1243" />
    <meta property="og:image:height" content="980" />
    <meta property="og:image:alt" content="Oculé — speed reader. The word 'oculé' centered with the letter 'c' highlighted in amber." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Oculé — a quiet speed reader for the web" />
    <meta
      name="twitter:description"
      content="Browser-only speed reader. RSVP word streaming with an ORP letter anchor, plus a guided highlight mode."
    />
    <meta name="twitter:image" content="https://ocule.app/screenshot-1.png" />

    <!-- Structured data: helps Google understand what this is -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Oculé",
        "url": "https://ocule.app/",
        "description": "Browser-only speed reader using RSVP and an ORP letter anchor. Paste any text and read it faster.",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Web",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&family=Literata:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
